</usr/share/alsa/alsa.conf>
# Kiwi's 12 kHz mono PCM is converted to the verified codec hardware format.
# libasound2-plugins supplies the high-quality libsamplerate converter.
pcm.cm5_speaker {
    type plug
    rate_converter "samplerate_best"
    slave {
        pcm "hw:CM5ES8316,0"
        format S16_LE
        rate 48000
        channels 2
    }
}

# Apply as /etc/systemd/system/ituner-sdr-lcd-kms.service.d/audio-realtime.conf
# The renderer remains normal priority. Only its short PCM clock thread and
# pw-cat child raise themselves to modest SCHED_RR priority at runtime.
[Service]
AmbientCapabilities=CAP_SYS_NICE
LimitRTPRIO=20
LimitMEMLOCK=64M
RestrictRealtime=no

<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>iTuner · SSTV gallery</title>
<style>
:root{color-scheme:dark;font:16px system-ui;background:#071219;color:#d9e9ee}body{max-width:1500px;margin:0 auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}h1{font-size:30px;margin:0;color:#68eac2}p{color:#8faeb9}select,button{font:inherit;background:#15343d;color:#d9e9ee;border:1px solid #3e6a73;border-radius:8px;padding:12px;min-height:48px}#status{min-height:2em}#decoders{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}.decoder{background:#112d34;border-radius:8px;padding:12px;font-size:14px}#gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:20px}.card{background:#11222a;border-radius:12px;overflow:hidden;border:1px solid #24414c}.card button{display:block;width:100%;padding:0;border:0;background:#020a0e;border-radius:0}.card img{display:block;width:100%;height:240px;object-fit:contain}.caption{padding:14px;line-height:1.5}.caption strong{display:block}.caption small{color:#8faeb9}dialog{background:#071219;color:#d9e9ee;max-width:95vw;border:1px solid #3e6a73;border-radius:12px}dialog::backdrop{background:#000c}dialog#viewer img{display:block;width:min(85vw,1000px);height:70vh;max-height:75vh;object-fit:contain;margin:16px auto}dialog button{float:right}a{color:#68eac2}
</style>
<style>.preview{position:relative;background:#020a0e}.placeholder{height:240px;display:grid;place-content:center;color:#8faeb9}.live-label{position:absolute;top:0;left:0;right:0;background:#104337e8;color:#9cffd7;padding:6px 10px;font-size:14px}.preview progress{position:absolute;bottom:0;left:0;width:100%;height:7px;accent-color:#68eac2}.decoder .preview{width:184px;margin-top:8px}.decoder img,.decoder .placeholder{height:110px;width:184px;object-fit:contain}.decoder .placeholder{font-size:12px}</style>
<header><div><h1>SSTV gallery</h1><p>Images received by your iTuner decoders · click an image to enlarge</p></div><nav aria-label="Digital modes"><a href="/sstv" aria-current="page">SSTV</a> · <a href="/wspr">WSPR receivers</a> · <a href="/hell">Hell RX</a></nav><label>Receiver <select id="filter"><option value="">All receivers</option></select></label></header>
<div id="receiver-toolbar"></div><p id="notice" role="status" aria-live="polite"></p><div id="decoders"></div><p id="status" role="status">Loading images…</p><main id="gallery"></main>
<dialog id="viewer"><button id="close">Close</button><img id="large" alt="Decoded SSTV image"><p id="detail"></p><a id="download" download>Download PNG</a></dialog>
<script src="/digital-controls.js"></script>
<script>
const $=id=>document.getElementById(id);let signature='', refreshTimer, refreshing=false;const controls=new DigitalControls('sstv',refresh);
function imageURL(item){return '/images/'+item.id+'.png?v='+item.updated_ns}
function preview(item){const el=document.createElement('div');el.className='preview';if(item.has_image){const img=document.createElement('img');img.src=imageURL(item);img.alt=item.mode+' from '+item.receiver;img.loading='lazy';el.append(img)}else{const p=document.createElement('div');p.className='placeholder';p.textContent='Waiting for first lines…';el.append(p)}if(['receiving','processing'].includes(item.kind)){const label=document.createElement('div');label.className='live-label';label.textContent=item.kind==='processing'?'Processing…':'Receiving · '+item.progress_pct+'%';const bar=document.createElement('progress');bar.max=100;bar.value=item.progress_pct;el.append(label,bar)}return el}
function show(item){$('large').src=imageURL(item);$('detail').textContent=item.mode+' · '+item.band+' · '+item.receiver+' · '+item.capture_utc;$('download').href=imageURL(item);$('viewer').showModal()}
$('close').onclick=()=>$('viewer').close();$('filter').onchange=()=>{signature='';refresh()};
async function refresh(){clearTimeout(refreshTimer);if(refreshing)return;refreshing=true;try{const response=await fetch('/api/sstv',{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();controls.setData(data);const selected=$('filter').value;
 const names=new Map(data.images.map(i=>[i.session_id,i.receiver+' · '+i.band]));for(const d of data.decoders)names.set(d.id,d.name+' · '+d.band);
 $('filter').replaceChildren(new Option('All receivers',''));for(const [key,name]of names)$('filter').add(new Option(name,key));$('filter').value=names.has(selected)?selected:'';
 $('decoders').replaceChildren();for(const d of data.decoders){const el=document.createElement('div');el.className='decoder';el.textContent=d.name+' · '+(d.freq_khz/1000).toFixed(3)+' MHz '+d.mode.toUpperCase()+' · '+d.status;el.title=d.detail;el.append(controls.buttons(d));const item=data.images.find(i=>i.session_id===d.id);if(item){const thumb=document.createElement('button');thumb.style.display='block';thumb.style.padding='0';thumb.style.marginTop='10px';thumb.disabled=!item.has_image;thumb.ariaLabel='Enlarge receiver preview '+item.mode;thumb.onclick=()=>show(item);thumb.append(preview(item));el.append(thumb);}$('decoders').append(el)}
 const images=data.images.filter(i=>!$('filter').value||i.session_id===$('filter').value);const next=JSON.stringify(images.map(i=>[i.id,i.updated_ns,i.kind,i.progress_pct,i.has_image]));
 if(next!==signature){signature=next;$('gallery').replaceChildren();for(const item of images){const card=document.createElement('article');card.className='card';const button=document.createElement('button');button.ariaLabel='Enlarge '+item.mode+' image';button.disabled=!item.has_image;button.onclick=()=>show(item);button.append(preview(item));const caption=document.createElement('div');caption.className='caption';const title=document.createElement('strong');title.textContent=item.mode+' · '+item.band+' · '+item.progress_pct+'%';const detail=document.createElement('small');detail.textContent=item.receiver+' · '+item.capture_utc.replace('T',' ').replace('Z',' UTC');caption.append(title,detail);card.append(button,caption);$('gallery').append(card)}}
 if($('viewer').open){const item=data.images.find(i=>imageURL(i).split('?')[0]===$('large').getAttribute('src').split('?')[0]);if(item&&item.has_image){$('large').src=imageURL(item);$('detail').textContent=item.mode+' · '+item.kind+' · '+item.progress_pct+'%';$('download').href=imageURL(item)}}
 $('status').textContent=images.length?images.length+' images · newest first · updates every 5 seconds':'Waiting for an SSTV transmission. Use Add decoder above to choose a receiver and band, or Start an existing decoder.';
 }catch(e){$('status').textContent='Cannot reach the SDR. Retrying…'}finally{refreshing=false;refreshTimer=setTimeout(refresh,5000)}}refresh();
</script></html>

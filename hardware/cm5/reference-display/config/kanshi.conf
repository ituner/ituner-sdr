# Historical verified machine: unused DSI0 panel was still enumerated as DSI-1.
# A fresh install with only the FPC2 overlay may number the output differently.
# Check wlr-randr and adapt this example before merging into ~/.config/kanshi/config.
profile cm5_fpc2_only {
    output DSI-1 disable
    output DSI-2 enable position 0,0
}
